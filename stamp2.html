  <script>
    const STORAGE_KEY = "canva_stamp_manager_independent_v1";
    const defaults = ["발표왕", "집중왕", "필기왕", "게임왕"];
    let records = [];
    let currentClass = 1;
    let activeStudent = null;

    function loadRecords() {
      try {
        const saved = JSON.parse(localStorage.getItem(STORAGE_KEY));
        records = Array.isArray(saved) ? saved : [];
      } catch (error) {
        records = [];
      }
    }

    function persist() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(records));
    }

    function uid() {
      return "local-" + Date.now().toString(36) + "-" + Math.random().toString(36).slice(2, 8);
    }

    function esc(value) {
      return String(value || "").replace(/[&<>"']/g, char => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[char]));
    }

    function toast(message) {
      const element = document.getElementById("toast");
      element.textContent = message;
      element.classList.add("show");
      clearTimeout(window.toastTimer);
      window.toastTimer = setTimeout(() => element.classList.remove("show"), 2400);
    }

    function dateText(iso) {
      return new Date(iso).toLocaleString("ko-KR", {month:"2-digit",day:"2-digit",hour:"2-digit",minute:"2-digit"});
    }

    function activeStudents() {
      return records.filter(item => item.type === "student" && item.active && item.class_num === currentClass);
    }

    function activeStamps() {
      const custom = records.filter(item => item.type === "stamp" && item.active).map(item => item.stamp_type);
      return [...new Set([...defaults, ...custom])];
    }

    function logs() {
      return records.filter(item => item.type === "log" && item.active);
    }

    function stampsFor(student) {
      return logs().filter(item => item.class_num === student.class_num && item.student_id === student.student_id && item.action !== "note");
    }

    function total(student) {
      return stampsFor(student).reduce((sum, item) => sum + (item.action === "add" ? 1 : -1), 0);
    }

    function countStamp(student, stamp) {
      return stampsFor(student).filter(item => item.stamp_type === stamp).reduce((sum, item) => sum + (item.action === "add" ? 1 : -1), 0);
    }

    function notesFor(student) {
      return logs().filter(item => item.class_num === student.class_num && item.student_id === student.student_id && item.action === "note");
    }

    function render() {
      document.querySelectorAll(".class-tab").forEach((button, index) => button.classList.toggle("active", index + 1 === currentClass));
      const shell = document.querySelector(".app-shell");
      shell.classList.remove("theme-pink","theme-yellow","theme-sky","theme-green");
      shell.classList.add(["theme-pink","theme-yellow","theme-sky","theme-green"][currentClass - 1]);

      const students = activeStudents();
      const stamps = activeStamps();
      const today = new Date().toDateString();
      const additionsToday = logs().filter(item => item.class_num === currentClass && item.action === "add" && new Date(item.timestamp).toDateString() === today);
      const leader = [...students].sort((a,b) => total(b) - total(a))[0];

      document.getElementById("current-class-label").textContent = currentClass + "반";
      document.getElementById("student-count").textContent = students.length + "명";
      document.getElementById("total-stamps").textContent = students.reduce((sum, student) => sum + total(student), 0) + "개";
      document.getElementById("today-stamps").textContent = additionsToday.length + "개";
      document.getElementById("leader-line").textContent = leader && total(leader) > 0 ? leader.student_name + " (" + total(leader) + "개)" : "아직 1등 기록이 없습니다";

      document.getElementById("student-table-head").innerHTML = "<th>학번</th><th>이름</th><th>총 스탬프</th>" + stamps.map(stamp => "<th>" + esc(stamp) + "</th>").join("") + "<th>누가기록</th>";
      const query = document.getElementById("student-search").value.trim().toLowerCase();
      const sort = document.getElementById("sort-select").value;
      const view = students.filter(student => (student.student_id + student.student_name).toLowerCase().includes(query)).sort((a,b) => {
        if (sort === "name") return a.student_name.localeCompare(b.student_name, "ko");
        if (sort === "total") return total(b) - total(a);
        return String(a.student_id).localeCompare(String(b.student_id), undefined, {numeric:true});
      });

      document.getElementById("student-table-body").innerHTML = view.map(student => `
        <tr class="${total(student) > 0 && total(student) % 5 === 0 ? "reward-ready" : ""}">
          <td>${esc(student.student_id)}</td>
          <td><button class="student-name" type="button" onclick="openStudent('${student.id}')">${esc(student.student_name)}</button></td>
          <td><strong>${total(student)}</strong></td>
          ${stamps.map(stamp => `<td><span class="stamp-pill">${countStamp(student, stamp)}</span></td>`).join("")}
          <td><span class="text-sm text-[#8d7b59]">${notesFor(student).length ? notesFor(student).length + "개" : "—"}</span></td>
        </tr>`).join("");
      document.getElementById("empty-students").classList.toggle("hidden", view.length !== 0);
    }

    function setClass(number) {
      currentClass = number;
      render();
    }

    function addRecord(record) {
      if (records.length >= 999) {
        toast("최대 999개의 기록에 도달했습니다. 불필요한 기록을 삭제해 주세요.");
        return false;
      }
      records.push({...record, id:uid()});
      persist();
      render();
      refreshOpenPanels();
      return true;
    }

    function updateRecord(id, updates) {
      const index = records.findIndex(item => item.id === id);
      if (index < 0) return false;
      records[index] = {...records[index], ...updates};
      persist();
      render();
      refreshOpenPanels();
      return true;
    }

    function giveStamp(student, stamp, action = "add") {
      if (action === "subtract" && countStamp(student, stamp) < 1) {
        toast("차감할 스탬프가 없습니다.");
        return;
      }
      if (addRecord({type:"log",class_num:student.class_num,student_id:student.student_id,student_name:student.student_name,stamp_type:stamp,action,timestamp:new Date().toISOString(),active:true})) {
        toast(action === "add" ? "스탬프를 지급했습니다." : "스탬프를 차감했습니다.");
      }
    }

    function openStudent(id) {
      activeStudent = records.find(item => item.id === id);
      if (!activeStudent) return;
      document.getElementById("student-modal-id").textContent = activeStudent.student_id;
      document.getElementById("student-modal-title").textContent = activeStudent.student_name;
      document.getElementById("student-modal").classList.remove("hidden");
      renderStudentModal();
    }

    function renderStudentModal() {
      if (!activeStudent) return;
      const latest = records.find(item => item.id === activeStudent.id);
      if (!latest) return;
      activeStudent = latest;
      const sum = total(activeStudent);
      const totalEl = document.getElementById("modal-total");
      totalEl.textContent = sum + "개";
      totalEl.classList.toggle("reward-total", sum > 0 && sum % 5 === 0);
      document.getElementById("student-stamp-actions").innerHTML = activeStamps().map(stamp => `
        <div class="grid grid-cols-[1fr_auto] gap-2">
          <button type="button" class="stamp-action rounded-2xl px-4 text-left font-bold" onclick="giveFromModal(${JSON.stringify(stamp)},'add')">${esc(stamp)} <span class="text-[#9889ae]">+1</span></button>
          <button type="button" class="stamp-action minus rounded-2xl px-4 font-bold" onclick="giveFromModal(${JSON.stringify(stamp)},'subtract')">−1</button>
        </div>`).join("");

      const recent = logs().filter(item => item.class_num === activeStudent.class_num && item.student_id === activeStudent.student_id).sort((a,b) => new Date(b.timestamp) - new Date(a.timestamp)).slice(0,12);
      document.getElementById("student-history-list").innerHTML = recent.length ? recent.map(item => `
        <li class="${item.action === "note" ? "note-card" : "log-card"} rounded-xl p-3 flex justify-between gap-3">
          <div><p class="text-xs text-[#8a8098]">${dateText(item.timestamp)} · ${item.action === "note" ? "누가기록" : "스탬프 기록"}</p><p class="mt-1 text-sm font-semibold">${item.action === "note" ? esc(item.stamp_type) : esc(item.stamp_type) + " " + (item.action === "add" ? "+1" : "−1")}</p></div>
          <button type="button" class="text-sm font-bold text-[#a76778] underline self-start" onclick="deleteLog('${item.id}')">삭제</button>
        </li>`).join("") : '<li class="py-4 text-[#8a8098]">아직 기록이 없습니다.</li>';
    }

    function giveFromModal(stamp, action) {
      if (activeStudent) giveStamp(activeStudent, stamp, action);
    }

    function saveNote(event) {
      event.preventDefault();
      if (!activeStudent) return;
      const input = document.getElementById("student-note-input");
      const note = input.value.trim();
      if (!note) return;
      const button = document.getElementById("note-save-button");
      button.disabled = true;
      const ok = addRecord({type:"log",class_num:activeStudent.class_num,student_id:activeStudent.student_id,student_name:activeStudent.student_name,stamp_type:note,action:"note",timestamp:new Date().toISOString(),active:true});
      button.disabled = false;
      if (ok) { input.value = ""; toast("누가기록을 저장했습니다."); }
    }

    function openStudentManager() {
      document.getElementById("student-manager-modal").classList.remove("hidden");
      renderStudentManager();
    }

    function renderStudentManager() {
      const list = activeStudents().sort((a,b) => String(a.student_id).localeCompare(String(b.student_id),undefined,{numeric:true}));
      document.getElementById("manager-student-list").innerHTML = list.length ? list.map(student => `
        <div class="py-3 flex items-center justify-between gap-3">
          <span><strong>${esc(student.student_id)}</strong> · ${esc(student.student_name)}</span>
          <span class="flex gap-3"><button type="button" class="text-sm font-bold text-[#7660aa]" onclick="editStudent('${student.id}')">수정</button><button type="button" class="text-sm font-bold text-[#b26678]" onclick="deactivateStudent('${student.id}')">비활성화</button></span>
        </div>`).join("") : '<p class="py-5 text-[#8a8098]">등록된 학생이 없습니다.</p>';
    }

    function editStudent(id) {
      const student = records.find(item => item.id === id);
      if (!student) return;
      document.getElementById("edit-student-key").value = id;
      document.getElementById("student-id-input").value = student.student_id;
      document.getElementById("student-name-input").value = student.student_name;
    }

    function saveStudent(event) {
      event.preventDefault();
      const button = document.getElementById("student-save-button");
      const id = document.getElementById("student-id-input").value.trim();
      const name = document.getElementById("student-name-input").value.trim();
      const key = document.getElementById("edit-student-key").value;
      button.disabled = true;
      const ok = key ? updateRecord(key,{student_id:id,student_name:name}) : addRecord({type:"student",class_num:currentClass,student_id:id,student_name:name,stamp_type:"",action:"",timestamp:new Date().toISOString(),active:true});
      button.disabled = false;
      if (ok) {
        event.target.reset();
        document.getElementById("edit-student-key").value = "";
        toast("학생 정보를 저장했습니다.");
      }
    }

    function deactivateStudent(id) {
      ask("이 학생을 비활성화할까요? 기존 기록은 보존됩니다.", () => {
        if (updateRecord(id,{active:false})) toast("학생을 비활성화했습니다.");
      });
    }

    function openStampManager() {
      document.getElementById("stamp-manager-modal").classList.remove("hidden");
      renderStampManager();
    }

    function renderStampManager() {
      const custom = records.filter(item => item.type === "stamp" && item.active);
      document.getElementById("manager-stamp-list").innerHTML = activeStamps().map(stamp => {
        const record = custom.find(item => item.stamp_type === stamp);
        return `<div class="py-3 flex items-center justify-between gap-3"><strong>${esc(stamp)}${record ? "" : ' <span class="text-xs text-[#9a8ead]">(기본)</span>'}</strong>${record ? `<span class="flex gap-3"><button type="button" class="text-sm font-bold text-[#7660aa]" onclick="editStamp('${record.id}')">수정</button><button type="button" class="text-sm font-bold text-[#b26678]" onclick="deactivateStamp('${record.id}')">비활성화</button></span>` : ""}</div>`;
      }).join("");
    }

    function editStamp(id) {
      const stamp = records.find(item => item.id === id);
      if (!stamp) return;
      document.getElementById("edit-stamp-key").value = id;
      document.getElementById("stamp-name-input").value = stamp.stamp_type;
    }

    function saveStamp(event) {
      event.preventDefault();
      const button = document.getElementById("stamp-save-button");
      const name = document.getElementById("stamp-name-input").value.trim();
      const key = document.getElementById("edit-stamp-key").value;
      if (activeStamps().includes(name) && !key) { toast("이미 있는 스탬프입니다."); return; }
      button.disabled = true;
      const ok = key ? updateRecord(key,{stamp_type:name}) : addRecord({type:"stamp",class_num:0,student_id:"",student_name:"",stamp_type:name,action:"",timestamp:new Date().toISOString(),active:true});
      button.disabled = false;
      if (ok) {
        event.target.reset();
        document.getElementById("edit-stamp-key").value = "";
        toast("스탬프를 저장했습니다.");
      }
    }

    function deactivateStamp(id) {
      ask("이 스탬프를 목록에서 비활성화할까요? 기존 지급 기록은 보존됩니다.", () => {
        if (updateRecord(id,{active:false})) toast("스탬프를 비활성화했습니다.");
      });
    }

    function openHistory() {
      document.getElementById("history-modal").classList.remove("hidden");
      renderHistory();
    }

    function renderHistory() {
      const list = logs().filter(item => item.class_num === currentClass).sort((a,b) => new Date(b.timestamp) - new Date(a.timestamp)).slice(0,100);
      document.getElementById("history-list").innerHTML = list.length ? list.map(item => `
        <article class="${item.action === "note" ? "note-card" : "log-card"} rounded-xl p-3 flex gap-3 justify-between">
          <div><strong class="text-sm">${dateText(item.timestamp)}</strong><p class="text-sm mt-1">${esc(item.student_id)} · ${esc(item.student_name)}</p><p class="text-sm mt-1 font-semibold">${item.action === "note" ? "누가기록 · " + esc(item.stamp_type) : esc(item.stamp_type) + " " + (item.action === "add" ? "+1" : "−1")}</p></div>
          <button type="button" class="text-sm text-[#b26678] underline self-start" onclick="deleteLog('${item.id}')">삭제</button>
        </article>`).join("") : '<p class="py-6 text-center text-[#8a8098]">이 반의 기록이 없습니다.</p>';
    }

    function deleteLog(id) {
      ask("이 기록을 삭제할까요? 삭제한 기록은 총계에 반영되지 않습니다.", () => {
        if (updateRecord(id,{active:false})) toast("기록을 삭제했습니다.");
      });
    }

    function ask(message, callback) {
      document.getElementById("confirm-message").textContent = message;
      document.getElementById("confirm-accept").onclick = () => {
        closeModal("confirm-modal");
        callback();
      };
      document.getElementById("confirm-modal").classList.remove("hidden");
    }

    function closeModal(id) {
      document.getElementById(id).classList.add("hidden");
    }

    function refreshOpenPanels() {
      if (!document.getElementById("student-manager-modal").classList.contains("hidden")) renderStudentManager();
      if (!document.getElementById("stamp-manager-modal").classList.contains("hidden")) renderStampManager();
      if (!document.getElementById("history-modal").classList.contains("hidden")) renderHistory();
      if (!document.getElementById("student-modal").classList.contains("hidden")) renderStudentModal();
    }

    loadRecords();
    render();
    lucide.createIcons();
  </script>
 </body>
</html>
